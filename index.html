<style>
/* ============ TOKENS ============ */
:root{
  --paper:#FDF6F3;          /* off-white blush ground */
  --surface:#FFFFFF;
  --surface-2:#FBEDEC;      /* blush surface */
  --surface-3:#F6E1E0;      /* deeper blush */
  --line:#F0D9D7;           /* hairline, rose-biased */
  --ink:#4A2733;            /* wine ink (primary text) */
  --ink-2:#8A5F6A;          /* muted malva */
  --ink-3:#B08E97;          /* faint */
  --rose:#C9647E;           /* rosa queimado (primary accent) */
  --rose-deep:#A94466;      /* deeper rose for pressed/gradient */
  --rose-soft:#F4C9D3;      /* light rose */
  --wine:#5B2A44;           /* vinho/malva contrast */
  --gold:#C9A24B;           /* dourado, sparing */
  --gold-soft:#EBD9A8;
  --good:#4E9E82;           /* saudável */
  --good-bg:#E4F1EB;
  --warn:#C98A3C;           /* atenção */
  --warn-bg:#F6E9D5;
  --alert:#C25C6B;          /* revisar (kept in-palette) */
  --alert-bg:#F7DEE0;
  /* chart categorical (rose-family, validated for hue separation) */
  --c1:#C9647E;  /* rosa queimado */
  --c2:#6E5B8A;  /* malva/roxo */
  --c3:#4E9E82;  /* verde */
  --c4:#C9A24B;  /* dourado */
  --c5:#8AA9C4;  /* azul suave */
  --c6:#D68F6E;  /* terracota */
  --shadow:0 6px 24px -8px rgba(120,40,70,.18);
  --shadow-lg:0 18px 48px -18px rgba(120,40,70,.30);
  --radius:22px;
  --radius-sm:14px;
  --maxw:480px;
  --nav-h:78px;
  --fdisplay:'Fraunces',Georgia,'Times New Roman',serif;
  --fbody:'Nunito Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#241019;
    --surface:#301622;
    --surface-2:#3A1B29;
    --surface-3:#45212F;
    --line:#4A2534;
    --ink:#F6E4EA;
    --ink-2:#D3A9B7;
    --ink-3:#A57C8B;
    --rose:#E58BA3;
    --rose-deep:#C9647E;
    --rose-soft:#5A2A3C;
    --wine:#F0C9D8;
    --gold:#E0C273;
    --gold-soft:#5A4B2A;
    --good:#6FBF9F; --good-bg:#1E3A30;
    --warn:#E0AE62; --warn-bg:#3E3020;
    --alert:#E08491; --alert-bg:#3E1F27;
    --c1:#E58BA3; --c2:#A995C9; --c3:#6FBF9F; --c4:#E0C273; --c5:#A9C4DC; --c6:#E4A788;
    --shadow:0 6px 24px -8px rgba(0,0,0,.5);
    --shadow-lg:0 18px 48px -18px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#241019; --surface:#301622; --surface-2:#3A1B29; --surface-3:#45212F;
  --line:#4A2534; --ink:#F6E4EA; --ink-2:#D3A9B7; --ink-3:#A57C8B; --wine:#F0C9D8;
  --rose:#E58BA3; --rose-deep:#C9647E; --rose-soft:#5A2A3C; --gold:#E0C273; --gold-soft:#5A4B2A;
  --good:#6FBF9F; --good-bg:#1E3A30; --warn:#E0AE62; --warn-bg:#3E3020; --alert:#E08491; --alert-bg:#3E1F27;
  --c1:#E58BA3; --c2:#A995C9; --c3:#6FBF9F; --c4:#E0C273; --c5:#A9C4DC; --c6:#E4A788;
  --shadow:0 6px 24px -8px rgba(0,0,0,.5); --shadow-lg:0 18px 48px -18px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, var(--surface-2) 0%, transparent 60%),
    var(--paper);
  color:var(--ink);
  font-family:var(--fbody);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px;border-radius:8px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-family:var(--fdisplay);font-weight:600;text-wrap:balance;color:var(--ink)}

/* ============ SHELL ============ */
#app{max-width:var(--maxw);margin:0 auto;position:relative;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));}
.screen{display:none;animation:fade .35s ease both}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}

.pad{padding:0 18px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 6px}
.hello{font-family:var(--fdisplay);font-size:20px;font-weight:600}
.hello span{color:var(--rose)}
.subhello{color:var(--ink-2);font-size:13px;margin-top:1px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:17px}

.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:14px 18px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.section-title{font-family:var(--fdisplay);font-size:16px;font-weight:600;margin:22px 18px 2px;display:flex;align-items:center;gap:8px}
.section-sub{color:var(--ink-2);font-size:12.5px;margin:0 18px 8px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:700}

/* demo banner */
.demo-banner{margin:12px 18px 0;background:linear-gradient(100deg,var(--gold-soft),var(--surface-2));border:1px dashed var(--gold);border-radius:var(--radius-sm);padding:11px 14px;font-size:12.5px;color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo-banner b{color:var(--wine)}
.demo-actions{display:flex;gap:6px;flex-shrink:0}
.demo-actions button{font-size:11px;font-weight:700;padding:6px 9px;border-radius:9px;background:var(--surface);color:var(--rose);box-shadow:var(--shadow)}

/* hero patrimonio */
.hero{background:linear-gradient(150deg,var(--rose) 0%,var(--rose-deep) 60%,var(--wine) 130%);color:#fff;border-radius:26px;margin:14px 18px;padding:22px 22px 20px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero::before{content:"";position:absolute;right:30px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-weight:700;position:relative}
.hero .big{font-family:var(--fdisplay);font-weight:600;font-size:42px;line-height:1;margin:8px 0 2px;letter-spacing:-.5px;position:relative}
.hero .big small{font-size:20px;opacity:.8;font-weight:500}
.hero .row{display:flex;gap:14px;margin-top:12px;position:relative;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.18);backdrop-filter:blur(4px);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip.up::before{content:"▲";font-size:9px}
.chip.down::before{content:"▼";font-size:9px}

/* meta progress */
.meta-head{display:flex;justify-content:space-between;align-items:baseline}
.meta-head .pct{font-family:var(--fdisplay);font-size:30px;font-weight:600;color:var(--rose)}
.progress-track{height:16px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin:12px 0 8px;position:relative}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--rose-soft),var(--rose),var(--gold));transition:width .9s cubic-bezier(.22,1,.36,1);position:relative}
.progress-fill::after{content:"";position:absolute;right:0;top:0;bottom:0;width:22px;background:rgba(255,255,255,.4);filter:blur(3px)}
.meta-foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.projection{margin-top:12px;background:var(--surface-2);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--ink)}
.projection b{color:var(--wine);font-family:var(--fdisplay)}

.mini-controls{display:flex;gap:10px;margin-top:12px}
.mini-field{flex:1}
.mini-field label{font-size:11px;color:var(--ink-2);font-weight:700;display:block;margin-bottom:3px}
.mini-field .inp{display:flex;align-items:center;background:var(--surface-2);border-radius:10px;padding:7px 10px;border:1px solid var(--line)}
.mini-field .inp span{color:var(--ink-2);font-size:13px;margin-right:2px}
.mini-field input{background:none;border:none;width:100%;outline:none;font-weight:700;font-size:14px}

/* streak */
.streak-card{display:flex;align-items:center;gap:14px}
.streak-flame{font-size:34px;filter:drop-shadow(0 2px 6px rgba(201,100,126,.4))}
.streak-num{font-family:var(--fdisplay);font-size:26px;font-weight:600;color:var(--rose)}
.streak-dots{display:flex;gap:5px;margin-top:6px}
.sd{width:22px;height:8px;border-radius:4px;background:var(--surface-3)}
.sd.on{background:linear-gradient(90deg,var(--rose),var(--gold))}

/* next step CTA */
.nextstep{background:linear-gradient(120deg,var(--surface-2),var(--surface));border:1px solid var(--rose-soft);border-radius:var(--radius);margin:14px 18px;padding:16px;display:flex;align-items:center;gap:14px}
.nextstep .emoji{font-size:26px}
.nextstep .t{flex:1}
.nextstep .t b{font-family:var(--fdisplay);font-size:15px}
.nextstep .t p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.arrow-btn{background:var(--rose);color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;font-size:13px;white-space:nowrap;box-shadow:var(--shadow)}

/* level card */
.level-card{display:flex;align-items:center;gap:14px}
.level-badge{width:56px;height:56px;border-radius:18px;background:linear-gradient(140deg,var(--rose-soft),var(--gold-soft));display:grid;place-items:center;font-size:28px;flex-shrink:0}
.level-info{flex:1}
.level-info .nm{font-family:var(--fdisplay);font-weight:600;font-size:16px}
.level-info .xp{font-size:12px;color:var(--ink-2)}
.xpbar{height:8px;border-radius:4px;background:var(--surface-3);margin-top:6px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:4px}

/* achievements */
.ach-row{display:flex;gap:10px;overflow-x:auto;padding:4px 18px 6px;scrollbar-width:none}
.ach-row::-webkit-scrollbar{display:none}
.ach{flex:0 0 auto;width:104px;background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:12px;text-align:center}
.ach.locked{opacity:.5;filter:grayscale(.4)}
.ach .ic{font-size:26px}
.ach .nm{font-size:11px;font-weight:700;margin-top:6px;line-height:1.25}

/* generic list rows */
.list{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 18px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
.lrow .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.lrow .main{flex:1;min-width:0}
.lrow .main b{font-weight:700;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .main small{color:var(--ink-2);font-size:11.5px}
.lrow .val{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.lrow .val small{display:block;font-weight:700;font-size:11px}
.pos{color:var(--good)} .neg{color:var(--alert)}

/* pills / health chips */
.hpill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.hpill.g{background:var(--good-bg);color:var(--good)}
.hpill.a{background:var(--warn-bg);color:var(--warn)}
.hpill.r{background:var(--alert-bg);color:var(--alert)}

/* alerts */
.alertbox{display:flex;gap:11px;padding:12px 14px;border-radius:var(--radius-sm);margin:10px 18px;font-size:13px;align-items:flex-start}
.alertbox.a{background:var(--warn-bg)} .alertbox.r{background:var(--alert-bg)} .alertbox.i{background:var(--surface-2)}
.alertbox .ai{font-size:17px;flex-shrink:0}
.alertbox b{font-weight:800}
.alertbox p{margin:2px 0 0;color:var(--ink-2);font-size:12px}

/* segmented tabs */
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px;margin:14px 18px 4px}

.edu{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line)}

/* bottom nav */

.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:10px;font-weight:700}

.nav .center{position:relative}
.nav .center .fab{position:absolute;top:-22px;width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,var(--rose),var(--rose-deep));color:#fff;font-size:26px;display:grid;place-items:center;box-shadow:0 10px 22px -6px rgba(169,68,102,.6);border:4px solid var(--paper)}

/* modal / sheet */
.overlay{position:fixed;inset:0;background:rgba(60,20,40,.45);backdrop-filter:blur(2px);z-index:60;display:none;align-items:flex-end;justify-content:center}

.sheet{background:var(--paper);width:100%;max-width:var(--maxw);border-radius:26px 26px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;animation:slideup .3s cubic-bezier(.22,1,.36,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 14px}
.sheet h2{font-size:20px;margin-bottom:2px}
.sheet .sub{color:var(--ink-2);font-size:13px;margin-bottom:14px}
.field{margin-bottom:14px}

.field .box span{color:var(--ink-2);font-weight:700}
.field input,.field select,.field textarea{border:none;background:none;outline:none;width:100%;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}

.ministat{font-size:10.5px;font-weight:700;color:var(--ink-2);background:var(--surface-2);padding:3px 8px;border-radius:999px;white-space:nowrap}
.idea{border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:9px;background:var(--surface)}
.idea .ihead{display:flex;justify-content:space-between;align-items:center;gap:8px}

@keyframes spin{to{transform:rotate(360deg)}}

<script>
"use strict";
/* =========================================================
   FLORESCER — app pessoal de investimentos
   Dados no armazenamento local do dispositivo. IA via claude.use('sample').
   ========================================================= */

/* ---------- utils ---------- */
const BRL = n => 'R$ ' + Math.round(n).toLocaleString('pt-BR');
const BRL2 = n => 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = n => (n>=0?'+':'') + n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';
const $ = s => document.querySelector(s);
const el = (tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MONTHS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const todayISO = ()=> new Date().toISOString().slice(0,10);
const monthKey = d => { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'); };

/* ---------- seed demo data ---------- */
function seed(){
  return {
    version:1, demo:true,
    profile:{ name:'Patrícia', goal:1000000, monthlyContribution:2500, expectedReturn:10.5 },
    xp:3450, streak:4,
    edu:{}, // id -> true
    // fictional conservative portfolio (=170.000)
    holdings:[
      {id:'h1', inst:'BTG', klass:'Renda Fixa', type:'CDB', name:'CDB BTG 110% CDI', invested:30000, current:32000, rate:'110% CDI', maturity:'2027-03-15', liquidity:'No vencimento', issuer:'Banco BTG Pactual', fgc:true},
      {id:'h2', inst:'BTG', klass:'Renda Fixa', type:'Tesouro Direto', name:'Tesouro Selic 2029', invested:24000, current:25000, rate:'SELIC + 0,10%', maturity:'2029-03-01', liquidity:'D+1', issuer:'Tesouro Nacional', fgc:false},
      {id:'h3', inst:'XP', klass:'Renda Fixa', type:'CDB', name:'CDB XP 105% CDI', invested:27000, current:28000, rate:'105% CDI', maturity:'2026-10-20', liquidity:'No vencimento', issuer:'Banco XP', fgc:true},
      {id:'h4', inst:'XP', klass:'Renda Fixa', type:'Tesouro Direto', name:'Tesouro IPCA+ 2035', invested:20000, current:20000, rate:'IPCA + 6,10%', maturity:'2035-05-15', liquidity:'D+1', issuer:'Tesouro Nacional', fgc:false},
      {id:'h5', inst:'XP', klass:'Renda Fixa', type:'LCI/LCA', name:'LCI XP 95% CDI', invested:15000, current:15000, rate:'95% CDI (isento IR)', maturity:'2026-11-30', liquidity:'No vencimento', issuer:'Banco XP', fgc:true},
      {id:'h6', inst:'PicPay', klass:'Renda Fixa', type:'CDB', name:'CDB PicPay 100% CDI', invested:12000, current:12000, rate:'100% CDI', maturity:'2028-01-10', liquidity:'Diária', issuer:'PicPay Bank', fgc:true},
      {id:'h7', inst:'XP', klass:'Fundos', type:'Fundo', name:'XP Referenciado DI FIC', invested:10000, current:10120, rate:'CDI', category:'Renda Fixa DI', admFee:0.20, perfFee:0, r12:9.8, bench12:10.4, health:'g'},
      {id:'h8', inst:'BTG', klass:'Fundos', type:'Fundo', name:'BTG Multimercado FIM', invested:8000, current:7850, rate:'—', category:'Multimercado', admFee:1.9, perfFee:20, r12:6.2, bench12:10.4, health:'a'},
      {id:'h9', inst:'BTG', klass:'ETFs', type:'ETF', name:'IVVB11 (S&P 500)', invested:6800, current:8000, rate:'—', category:'Ações EUA', admFee:0.23, perfFee:0, r12:18.5, bench12:16.0, health:'g'},
      {id:'h10', inst:'XP', klass:'ETFs', type:'ETF', name:'BOVA11 (Ibovespa)', invested:5200, current:5000, rate:'—', category:'Ações BR', admFee:0.10, perfFee:0, r12:-1.4, bench12:2.0, health:'a'},
      {id:'h11', inst:'PicPay', klass:'Caixa', type:'Caixa', name:'Reserva de emergência', invested:7000, current:7000, rate:'102% CDI', maturity:null, liquidity:'Diária', issuer:'PicPay Bank', fgc:true},
    ],
    // last 13 monthly net worth snapshots (oldest->newest)
    history:[156800,158300,159100,160600,161500,162800,163900,165000,165900,166800,167300,167660,170000],
    // contributions log (recent). value in R$
    contributions:[
      {month:'-5', label:'abr', value:2500},
      {month:'-4', label:'mai', value:0},
      {month:'-3', label:'jun', value:2000},
      {month:'-2', label:'jul', value:2500},
      {month:'-1', label:'ago', value:3000},
      {month:'0',  label:'set', value:2340},
    ],
    transactions:[], // real aportes logged by user
  };
}

/* ---------- minha carteira real (dados da Patrícia) ----------
   Estes são os seus investimentos reais, embutidos no app. Eles entram uma única vez
   (controlado por DATA_VERSION) e, a partir daí, você edita tudo pela própria tela —
   o que você mudar no app nunca é sobrescrito por isto. */
const MY_DATA=[]; // vazio de propósito: site público não carrega dados pessoais
const DATA_VERSION='2026-09-09';
function applyMyData(){
  if(!MY_DATA.length){ if(S.dataVersion!==DATA_VERSION){ S.dataVersion=DATA_VERSION; save(); } return false; }
  if(S.dataVersion===DATA_VERSION) return false;
  try{ localStorage.setItem(KEY+'.backup', JSON.stringify(S)); }catch(e){}
  S.demo=false;
  S.holdings=JSON.parse(JSON.stringify(MY_DATA));
  S.holdings.forEach(h=>{ h.baseValue=h.current; h.since='2026-09-09'; }); // posição do extrato
  S.dataVersion=DATA_VERSION;
  if(S.profile.monthlyContribution===2500) S.profile.monthlyContribution=3000; // seu aporte mensal
  if(!S.profile.targetAllocation) S.profile.targetAllocation=Object.assign({},DEFAULT_TARGET);
  const t=S.holdings.reduce((a,h)=>a+(+h.current||0),0);
  if(!S.history||!S.history.length) S.history=[t]; else S.history[S.history.length-1]=t;
  S.justImported=true;
  save();
  return true;
}
function undoMyData(){
  try{
    const raw=localStorage.getItem(KEY+'.backup');
    if(raw){ const prev=JSON.parse(raw); prev.dataVersion=DATA_VERSION; prev.justImported=false; S=prev; save(); renderAll(); toast('Carteira anterior restaurada 🌸'); return; }
  }catch(e){}
  toast('Não encontrei uma versão anterior pra restaurar.');
}
function dismissImportBanner(){ S.justImported=false; save(); renderHome(); }
function ensureIds(){ S.holdings.forEach((h,i)=>{ if(!h.id) h.id='h'+i+'x'+Date.now(); }); }

/* ---------- store (localStorage, privado neste aparelho) ---------- */
const KEY='florescer.state.v1';
let S;
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){S=JSON.parse(raw); return;} }catch(e){}
  S=seed();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function resetDemo(){ S=seed(); save(); renderAll(); }
function startFresh(){
  S=seed(); S.demo=false; S.holdings=[]; S.history=[]; S.contributions=[]; S.xp=0; S.streak=0; S.edu={};
  S.profile.monthlyContribution=2500;
  save(); renderAll();
}
function wipeAll(){ try{localStorage.removeItem(KEY);}catch(e){} S=seed(); save(); renderAll(); }
/* ---------- taxas de referência (Banco Central · SGS) e rendimento automático ---------- */
const TAXAS_FALLBACK={cdi:13.90, selic:14.00, ipca12:4.44, em:'09/09/2026', fonte:'Banco Central (SGS)'};
const SGS={cdi:4389, selic:432, ipca12:13522};
function taxas(){ return Object.assign({},TAXAS_FALLBACK,S.taxas||{}); }
// consulta as séries oficiais do BC. Se falhar, mantém as últimas conhecidas — nunca inventa taxa.
async function fetchTaxas(silent){
  const base='https://api.bcb.gov.br/dados/serie/bcdata.sgs.';
  const get=async code=>{
    const r=await fetch(base+code+'/dados/ultimos/1?formato=json');
    if(!r.ok) throw new Error('http '+r.status);
    const j=await r.json();
    if(!j || !j.length) throw new Error('sem dados');
    return {v:parseFloat(String(j[0].valor).replace(',','.')), d:j[0].data};
  };
  try{
    const [c,se,ip]=await Promise.all([get(SGS.cdi),get(SGS.selic),get(SGS.ipca12)]);
    S.taxas={cdi:c.v, selic:se.v, ipca12:ip.v, em:c.d, fonte:'Banco Central (SGS)', fetchedAt:new Date().toISOString()};
    accrueAll(); save(); renderAll();
    if(!silent) toast('Taxas atualizadas · CDI '+String(c.v).replace('.',',')+'% a.a. 🌸');
    return true;
  }catch(e){
    if(!silent) toast('Não consegui falar com o Banco Central agora. Mantive as últimas taxas conhecidas.');
    return false;
  }
}
const RATE_KINDS=[
  {k:'pre',  label:'Prefixado',   unit:'% a.a.',    hint:'Taxa fixa combinada. Ex.: 13'},
  {k:'cdi',  label:'% do CDI',    unit:'% do CDI',  hint:'Ex.: 110 para 110% do CDI'},
  {k:'ipca', label:'IPCA +',      unit:'% a.a.',    hint:'A parte fixa. Ex.: 6 para IPCA + 6%'},
  {k:'selic',label:'Selic +',     unit:'% a.a.',    hint:'A parte fixa acima da Selic'},
  {k:'none', label:'Não rende sozinho', unit:'',    hint:'O valor só muda quando você editar'},
];
function toNum(v){ if(v==null) return null; const x=parseFloat(String(v).replace(',','.')); return isFinite(x)?x:null; }
// descobre como o investimento rende: usa os campos explícitos e, se não houver, lê o texto da taxa
function rateSpec(h){
  if(h.rateKind==='none') return null;
  if(h.rateKind && toNum(h.rateNum)!=null) return {kind:h.rateKind, num:toNum(h.rateNum)};
  const s=(h.rate||'').toString().toUpperCase();
  if(!s || s==='—') return null;
  if(s.includes('IPCA')){ const m=s.match(/IPCA\s*\+?\s*(\d+[.,]?\d*)/); return m?{kind:'ipca',num:toNum(m[1])}:null; }
  if(s.includes('SELIC')){ const m=s.match(/SELIC\s*\+?\s*(\d+[.,]?\d*)/); return {kind:'selic',num:m?toNum(m[1]):0}; }
  const m=s.match(/(\d+[.,]?\d*)/); const num=m?toNum(m[1]):null;
  if(num==null) return null;
  if(s.includes('CDI')) return {kind:'cdi',num};
  if(s.includes('A.A')||s.includes('AA')||s.includes('%')) return {kind:'pre',num};
  return null;
}
function annualRate(spec){
  const t=taxas(); if(!spec||spec.num==null) return null;
  if(spec.kind==='pre')   return spec.num/100;
  if(spec.kind==='cdi')   return (t.cdi/100)*(spec.num/100);
  if(spec.kind==='selic') return (t.selic/100)+(spec.num/100);
  if(spec.kind==='ipca')  return (1+t.ipca12/100)*(1+spec.num/100)-1;
  return null;
}
function rateLabel(h){
  const sp=rateSpec(h); const r=annualRate(sp); if(r==null) return null;
  const t=taxas(); const n=v=>String(Math.round(v*100)/100).replace('.',',');
  if(sp.kind==='pre')   return `${n(sp.num)}% a.a. (prefixado)`;
  if(sp.kind==='cdi')   return `${n(sp.num)}% do CDI · CDI hoje ${n(t.cdi)}% → ${n(r*100)}% a.a.`;
  if(sp.kind==='selic') return `Selic + ${n(sp.num)}% · Selic hoje ${n(t.selic)}% → ${n(r*100)}% a.a.`;
  if(sp.kind==='ipca')  return `IPCA + ${n(sp.num)}% · IPCA 12m ${n(t.ipca12)}% → ${n(r*100)}% a.a.`;
  return null;
}
// só renda fixa/caixa rende sozinho. Ações, ETFs, fundos e cripto dependem de preço de mercado: nunca projetamos.
function canAccrue(h){ return (h.klass==='Renda Fixa'||h.klass==='Caixa') && annualRate(rateSpec(h))!=null && h.since; }
function accrue(h){
  const base=(h.baseValue!=null? +h.baseValue : +h.current)||0;
  if(!canAccrue(h) || !base) return base;
  const r=annualRate(rateSpec(h));
  const start=new Date(h.since+'T00:00');
  let end=new Date();
  if(h.maturity){ const m=new Date(h.maturity+'T00:00'); if(m<end) end=m; } // para de render no vencimento
  const days=(end-start)/86400000;
  if(!(days>0)) return base;
  return base*Math.pow(1+r, days/365);
}
function accrueAll(){
  S.holdings.forEach(h=>{
    if(h.baseValue==null){ h.baseValue=+h.current||0; }
    if(!h.since){ h.since=todayISO(); }
    const v=accrue(h);
    if(isFinite(v)&&v>=0) h.current=Math.round(v*100)/100;
  });
}
// quando você informa o valor real do banco, ele vira a nova base e a contagem recomeça dali
function setBase(h,valor,quando){ h.baseValue=valor; h.current=valor; h.since=quando||todayISO(); }
function rateText(kind,num){

  const n=String(num).replace('.',',');
  if(kind==='pre') return n+'% a.a.';
  if(kind==='cdi') return n+'% do CDI';
  if(kind==='ipca') return 'IPCA + '+n+'%';
  if(kind==='selic') return 'Selic + '+n+'%';
  return '—';
}

function dBR(iso){ if(!iso) return '—'; try{ return new Date(iso+'T00:00').toLocaleDateString('pt-BR'); }catch(e){ return iso; } }

function byClass(){
  const m={}; S.holdings.forEach(h=>{ const k=CLASSES.includes(h.klass)?h.klass:'Outros'; m[k]=(m[k]||0)+(+h.current||0); }); return m;
}
function byInst(){
  const m={}; S.holdings.forEach(h=>{ m[h.inst]=(m[h.inst]||0)+(+h.current||0); }); return m;

function monthChange(){
  const h=S.history; if(h.length<2) return 0; return h[h.length-1]-h[h.length-2];

function change12(){
  const h=S.history; if(h.length<2) return 0; const first=h[Math.max(0,h.length-13)]; const last=h[h.length-1];
  return first? (last/first-1)*100 : 0;
}
// projection: months to reach goal given current total, monthly contribution, annual return
function monthsToGoal(cur,pmt,annual){
  const r=annual/100/12; let v=cur; let m=0;
  if(v>=S.profile.goal) return 0;
  while(v<S.profile.goal && m<1200){ v=v*(1+r)+pmt; m++; }
  return m>=1200? null : m;
}
function fmtYears(months){
  if(months==null) return 'muito tempo (ajuste seus aportes)';
  if(months===0) return 'meta atingida! 🎉';
  const y=Math.floor(months/12), mo=months%12;
  let s=''; if(y) s+=y+(y===1?' ano':' anos'); if(mo){ if(s)s+=' e '; s+=mo+(mo===1?' mês':' meses'); }
  return s||'menos de 1 mês';
}

/* ---------- SVG chart builders ---------- */
function lineChart(data,{w=440,h=150,pad=14,color='var(--rose)',fill=true,labels=null}={}){
  if(!data||data.length<2) return '<div style="color:var(--ink-3);font-size:12px;padding:20px;text-align:center">Sem dados suficientes ainda. Registre aportes para ver sua evolução. 🌱</div>';
  const min=Math.min(...data), max=Math.max(...data), span=(max-min)||1;
  const iw=w-pad*2, ih=h-pad*2-16;
  const X=i=>pad+iw*i/(data.length-1);
  const Y=v=>pad+ih-(v-min)/span*ih;
  let d='',a='';
  data.forEach((v,i)=>{ const x=X(i).toFixed(1),y=Y(v).toFixed(1); d+=(i?'L':'M')+x+' '+y+' '; });
  a='M'+pad+' '+(pad+ih)+' '+data.map((v,i)=>'L'+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')+' L'+X(data.length-1)+' '+(pad+ih)+' Z';
  const lastX=X(data.length-1), lastY=Y(data[data.length-1]);
  // gridlines
  let grid='';
  for(let g=0;g<=2;g++){ const yy=(pad+ih*g/2).toFixed(1); grid+=`<line x1="${pad}" y1="${yy}" x2="${w-pad}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`; }
  let labs='';
  if(labels){ labels.forEach((lb,i)=>{ if(lb) labs+=`<text x="${X(i).toFixed(1)}" y="${h-2}" font-size="9" fill="var(--ink-3)" text-anchor="middle" font-family="var(--fbody)">${lb}</text>`; }); }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Evolução do patrimônio">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0.01"/></linearGradient></defs>
    ${grid}
    ${fill?`<path d="${a}" fill="url(#lg)"/>`:''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
    ${labs}
  </svg>`;
}
function barChart(items,{w=440,h=150,pad=16,color='var(--rose)'}={}){
  if(!items.length) return '';
  const max=Math.max(...items.map(i=>i.v),1);
  const iw=w-pad*2, ih=h-pad*2-14;
  const bw=iw/items.length*0.56, gap=iw/items.length;
  let bars='';
  items.forEach((it,i)=>{
    const bh=Math.max(2,it.v/max*ih);
    const x=pad+gap*i+(gap-bw)/2, y=pad+ih-bh;
    const col= it.v===0? 'var(--surface-3)':color;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${col}"/>`;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-2}" font-size="9" fill="var(--ink-3)" text-anchor="middle">${esc(it.label)}</text>`;
    if(it.v>0) bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="8.5" fill="var(--ink-2)" text-anchor="middle" font-weight="700">${Math.round(it.v/1000)}k</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Aportes por mês">${bars}</svg>`;
}
function donut(map,colorFn,{size=170,thick=26}={}){
  const entries=Object.entries(map).filter(([k,v])=>v>0);
  const tot=entries.reduce((a,[,v])=>a+v,0)||1;
  const r=(size-thick)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  let off=0, segs='';
  entries.forEach(([k,v])=>{
    const frac=v/tot, len=frac*C;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorFn(k)}" stroke-width="${thick}"
      stroke-dasharray="${(len-2).toFixed(2)} ${(C-len+2).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"/>`;
    off+=len;
  });
  return {svg:`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Distribuição da carteira">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${thick}"/>
    ${segs}</svg>`, entries, tot};
}

function healthScores(){
  const tot=total()||1; const bc=byClass(); const bi=byInst();
  const rf=(bc['Renda Fixa']||0)+(bc['Caixa']||0);
  const liquid=(bc['Caixa']||0)+ S.holdings.filter(h=>/Di|D\+1|D1/i.test(h.liquidity||'')|| (h.liquidity||'').includes('Diária')).reduce((a,h)=>a+h.current,0);
  const maxInst=Math.max(0,...Object.values(bi));
  const classesUsed=Object.values(bc).filter(v=>v>0).length;
  const diversification=Math.round(Math.min(100, classesUsed*22 + (1-maxInst/tot)*30));
  const liquidity=Math.round(Math.min(100, (liquid/tot)*70 + 30));
  const concentration=Math.round(Math.max(0,100-(maxInst/tot)*100*1.15));
  const risk=Math.round(Math.min(100,(1-rf/tot)*100 + 6)); // low = conservative
  const suit=Math.round(Math.min(100, 60 + (rf/tot)*38)); // conservative profile -> high RF suits
  return {diversification,liquidity,concentration,risk,suit,maxInst,maxInstName:Object.keys(bi).find(k=>bi[k]===maxInst)};
}

/* ---------- confetti ---------- */
function confetti(){
  const c=$('#confetti'), ctx=c.getContext('2d');
  c.width=innerWidth; c.height=innerHeight; c.classList.add('on');
  const cols=['#C9647E','#E58BA3','#C9A24B','#F4C9D3','#6E5B8A','#EBD9A8'];
  const parts=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.4,r:4+Math.random()*6,vy:2+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4,col:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0; const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){ setTimeout(()=>c.classList.remove('on'),300); return; }
  (function anim(){
    t++; ctx.clearRect(0,0,c.width,c.height);
    parts.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); ctx.restore(); });
    if(t<150) requestAnimationFrame(anim); else c.classList.remove('on');
  })();
}

  const bc=byClass(), bi=byInst();
  const d=donut(bc,k=>classColor[k]||'var(--c6)');
  const dLegend=d.entries.map(([k,v])=>`<div class="li"><span class="sw" style="background:${classColor[k]||'var(--c6)'}"></span>${esc(k)} <small>${(v/d.tot*100).toFixed(0)}%</small></div>`).join('');
  // institution bars
  const instEntries=Object.entries(bi).sort((a,b)=>b[1]-a[1]);
  const maxI=Math.max(...instEntries.map(e=>e[1]),1);
  const instBars=instEntries.map(([k,v])=>`
    <div style="margin:10px 0">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>${esc(k)}</span><span class="tnum" style="color:var(--ink-2)">${(v/tot*100).toFixed(0)}% · ${BRL(v)}</span></div>
      <div class="progress-track" style="height:10px;margin:5px 0 0"><div style="height:100%;border-radius:999px;width:${(v/maxI*100).toFixed(0)}%;background:${instColor[k]||'var(--c6)'}"></div></div>
    </div>`).join('');
  const concAlert = Math.max(...Object.values(bi))/tot > 0.4 ? `<div class="alertbox a"><div class="ai">⚠️</div><div><b>Concentração por instituição</b><p>Boa parte do seu patrimônio está em uma só instituição. Diversificar entre corretoras reduz risco operacional (e você amplia a cobertura do FGC, que é por CPF e por instituição).</p></div></div>`:'';
  return `
  <div class="card">
    <div class="eyebrow">Patrimônio total</div>
    <div style="font-family:var(--fdisplay);font-size:34px;font-weight:600" class="tnum">${BRL(tot)}</div>
    <div style="display:flex;gap:16px;margin-top:6px;font-size:12.5px;color:var(--ink-2)">
      <span>Investido: <b style="color:var(--ink)">${BRL(inv)}</b></span>
      <span>Resultado: <b class="${gl>=0?'pos':'neg'}">${(gl>=0?'+':'')}${BRL(gl)} (${pct(inv?gl/inv*100:0)})</b></span>
    </div>
  </div>
  <div class="section-title">🍰 Distribuição por classe</div>
  <div class="card" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center">
    ${d.svg}
    <div class="legend" style="flex-direction:column;gap:8px">${dLegend}</div>
  </div>
  <div class="section-title">🏦 Concentração por instituição</div>
  <div class="card">${instBars}</div>
  ${concAlert}
  <div class="section-title">📋 Todos os investimentos</div>
  <div class="list">${S.holdings.map(holdingRow).join('')}</div>
  <div class="footer-note">Toque em qualquer investimento pra editar ou excluir. Use ＋ pra registrar um novo aporte.</div>`;
}
function holdingRow(h){
  const gl=(h.current-h.invested), glp=h.invested? gl/h.invested*100:0;
  return `<div class="lrow" style="cursor:pointer" onclick="openEditHolding('${esc(h.id)}')">
    <span class="dot" style="background:${classColor[h.klass]||'var(--c6)'}"></span>
    <div class="main"><b>${esc(h.name)}</b><small>${esc(h.inst)} · ${esc(h.type)}</small></div>
    <div class="val tnum">${BRL(h.current)}<small class="${h.noInvested?'':(gl>=0?'pos':'neg')}">${h.noInvested?'editar ›':pct(glp)}</small></div>
  </div>`;
}
function daysTo(dstr){ if(!dstr) return null; const d=new Date(dstr+'T00:00'); return Math.round((d-new Date())/86400000); }
function carteiraRF(){
  const rf=S.holdings.filter(h=>h.klass==='Renda Fixa'||h.klass==='Caixa');
  const tot=rf.reduce((a,h)=>a+h.current,0);
  const alerts=[];
  rf.forEach(h=>{ const dd=daysTo(h.maturity); if(dd!=null&&dd>=0&&dd<=60) alerts.push({h,dd}); });
  const alertHtml=alerts.map(({h,dd})=>`<div class="alertbox a"><div class="ai">⏳</div><div><b>${esc(h.name)} vence em ${dd} dias</b><p>Em ${new Date(h.maturity+'T00:00').toLocaleDateString('pt-BR')}. Planeje o reinvestimento com antecedência pra não deixar o dinheiro parado. Motivo do alerta: vencimento próximo.</p></div></div>`).join('');
  return `
  <div class="card"><div class="eyebrow">Total em renda fixa + caixa</div>
    <div style="font-family:var(--fdisplay);font-size:30px;font-weight:600" class="tnum">${BRL(tot)}</div>
    <div style="font-size:12.5px;color:var(--ink-2);margin-top:4px">${(tot/total()*100).toFixed(0)}% da carteira · o alicerce da investidora conservadora 🌷</div></div>
  ${alertHtml}
  ${rf.map(rfCard).join('')}
  <div class="footer-note">${taxasNota()} <span class="tiny-link" onclick="fetchTaxas()">Atualizar agora</span></div>`;
}
function rfCard(h){
  const dd=daysTo(h.maturity);
  const row=(l,v)=> v?`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px"><span style="color:var(--ink-2)">${l}</span><span style="font-weight:700">${v}</span></div>`:'';
  const gl=h.current-h.invested;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div><b style="font-family:var(--fdisplay);font-size:15px">${esc(h.name)}</b>
        <div style="font-size:11.5px;color:var(--ink-2);margin-top:2px">${esc(h.inst)} · ${esc(h.type)}</div></div>
      <div style="text-align:right"><div class="tnum" style="font-weight:800;font-size:16px">${BRL(h.current)}</div>
        ${h.noInvested?'':`<div class="tnum ${gl>=0?'pos':'neg'}" style="font-size:11.5px;font-weight:700">${gl>=0?'+':''}${BRL(gl)}</div>`}</div>
    </div>
    <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:6px">
      ${h.noInvested? row('Valor aplicado','—') : row('Valor investido',BRL(h.invested))}
      ${h.rend12!=null? row('Rendimento em 12 meses',BRL(h.rend12)) : ''}
      ${canAccrue(h)? row('Rendendo a', rateLabel(h)) : ''}
      ${row('Rentabilidade contratada',esc(h.rate))}
      ${row('Modalidade',esc(h.modalidade||''))}
      ${row('Indexador',esc(h.indexador||''))}
      ${row('Vencimento', h.maturity? new Date(h.maturity+'T00:00').toLocaleDateString('pt-BR')+(dd!=null&&dd>=0?` (${dd} dias)`:''):'Sem vencimento')}
      ${row('Liquidez',esc(h.liquidity))}
      ${row('Emissor',esc(h.issuer))}
      ${row('Cobertura FGC', h.fgc? '✅ Sim (até R$ 250 mil por CPF/instituição)':'❌ Não (Tesouro tem garantia do Governo)')}
    </div>
    ${canAccrue(h)?`<div class="alertbox i" style="margin:10px 0 0"><div class="ai">📈</div><div><p style="color:var(--ink);margin:0"><b>Valor estimado, rendendo sozinho.</b> Partindo de ${BRL(h.baseValue)} informados em ${dBR(h.since)}. Quando você conferir o extrato do banco, toque em Editar e coloque o valor real — a contagem recomeça dali.</p></div></div>`:''}
    ${h.noInvested?`<div style="font-size:11px;color:var(--ink-3);margin-top:8px">O extrato não trouxe o valor originalmente aplicado, então a rentabilidade desta posição ainda não é calculada. Você pode preencher tocando em Editar.</div>`:''}
    <button class="btn ghost" style="margin-top:10px;padding:9px;font-size:13px" onclick="openEditHolding('${esc(h.id)}')">✏️ Editar</button>
  </div>`;
}
function carteiraFundos(){
  const fd=S.holdings.filter(h=>h.klass==='Fundos'||h.klass==='ETFs');
  if(!fd.length) return `<div class="card" style="text-align:center;color:var(--ink-2);padding:26px">Você ainda não tem fundos ou ETFs. Diversificar aos poucos pode fortalecer sua carteira. 🌸</div>`;
  return fd.map(fundCard).join('') + `<div class="footer-note">A avaliação 🟢🟡🔴 é um ponto de partida pra investigar — nunca uma ordem de compra ou venda.</div>`;
}
function fundCard(h){
  const gl=h.current-h.invested, glp=h.invested?gl/h.invested*100:0;
  const hp = h.health==='g'?'<span class="hpill g">🟢 Saudável</span>': h.health==='a'?'<span class="hpill a">🟡 Atenção</span>':'<span class="hpill r">🔴 Revisar</span>';
  const vsB = h.r12!=null&&h.bench12!=null ? (h.r12-h.bench12) : null;
  const benchNote = vsB!=null ? (vsB>=0
      ? `Rendeu ${pct(h.r12)} em 12 meses, acima do benchmark (${pct(h.bench12)}). Bom sinal — acompanhe a consistência.`
      : `Rendeu ${pct(h.r12)} em 12 meses, abaixo do benchmark (${pct(h.bench12)}). Isso merece investigação, mas não significa automaticamente que você deva vender.`) : '';
  const row=(l,v)=> v!=null&&v!==''?`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px"><span style="color:var(--ink-2)">${l}</span><span style="font-weight:700">${v}</span></div>`:'';
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div><b style="font-family:var(--fdisplay);font-size:15px">${esc(h.name)}</b>
        <div style="font-size:11.5px;color:var(--ink-2);margin-top:2px">${esc(h.inst)} · ${esc(h.category||h.type)}</div>
        <div style="margin-top:6px">${hp}</div></div>
      <div style="text-align:right"><div class="tnum" style="font-weight:800;font-size:16px">${BRL(h.current)}</div>
        <div class="tnum ${gl>=0?'pos':'neg'}" style="font-size:11.5px;font-weight:700">${pct(glp)}</div></div>
    </div>
    <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:6px">
      ${row('Valor investido',BRL(h.invested))}
      ${row('Rentab. 12 meses', h.r12!=null?pct(h.r12):null)}
      ${row('Benchmark 12 meses', h.bench12!=null?pct(h.bench12):null)}
      ${row('Taxa de administração', h.admFee!=null?h.admFee+'% a.a.':null)}
      ${row('Taxa de performance', h.perfFee?h.perfFee+'%':'Sem')}
    </div>
    ${benchNote?`<div class="alertbox ${vsB>=0?'i':'a'}" style="margin:10px 0 0"><div class="ai">${vsB>=0?'💡':'🔎'}</div><div><p style="color:var(--ink);margin:0">${benchNote}</p></div></div>`:''}
    <button class="btn ghost" style="margin-top:10px;padding:9px;font-size:13px" onclick="openEditHolding('${esc(h.id)}')">✏️ Editar</button>
  </div>`;
}
function carteiraSaude(){
  const s=healthScores();
  const scores=[
    {l:'Diversificação',v:s.diversification,inv:false,note:'Quantas classes e instituições diferentes você usa.'},
    {l:'Liquidez',v:s.liquidity,inv:false,note:'Quanto do seu dinheiro você consegue resgatar rápido.'},
    {l:'Concentração',v:s.concentration,inv:false,note:'Quanto está distribuído entre instituições (maior = mais distribuído).'},
    {l:'Risco',v:s.risk,inv:true,note:'Exposição a renda variável. Menor = mais conservador.'},
    {l:'Adequação ao perfil',v:s.suit,inv:false,note:'O quanto a carteira combina com seu perfil conservador.'},
  ];
  const overall = (s.diversification+s.liquidity+s.concentration+(100-s.risk)+s.suit)/5;
  const verdict = overall>=75?['🌸 Sua carteira está saudável','var(--good)']: overall>=60?['🌼 Sua carteira está bem, com pontos de atenção','var(--warn)']:['🌷 Sua carteira precisa de alguns ajustes','var(--alert)'];
  return `
  <div class="card" style="text-align:center;background:linear-gradient(150deg,var(--surface),var(--surface-2))">
    <div style="font-size:40px">🩷</div>
    <h2 style="color:${verdict[1]};margin:6px 0 2px">${verdict[0]}</h2>
    <p style="color:var(--ink-2);font-size:13px;margin:0">Nota geral ${Math.round(overall)}/100</p>
  </div>
  <div class="card">
    ${scores.map(sc=>`<div class="score">
      <div class="top"><span>${sc.l}</span><span class="tnum">${sc.v}/100</span></div>
      <div class="track"><i style="width:${sc.v}%;background:${scoreColor(sc.v,sc.inv)}"></i></div>
      <div style="font-size:11px;color:var(--ink-3);margin-top:4px">${sc.note}</div>
    </div>`).join('')}
  </div>
  <div class="alertbox i"><div class="ai">🌸</div><div><b>Em resumo</b><p style="color:var(--ink)">Sua carteira é bastante conservadora e tem ótima liquidez — perfeito pra dormir tranquila. O principal ponto de atenção é a concentração: ${s.maxInstName?`boa parte está na ${esc(s.maxInstName)}`:'poucas instituições'}. Diversificar novos aportes entre corretoras e começar aos poucos em ETFs/fundos deixaria sua carteira mais resistente.</p></div></div>
  <div class="footer-note">Esta análise é educativa e baseada nos dados registrados. Não substitui orientação de um profissional.</div>`;
}

/* ---------- APORTE FLOW ---------- */
let aporteDraft={};
function openAporte(existing){
  aporteDraft={inst:'',klass:'',type:'',name:'',value:'',date:todayISO(),note:'',existing:!!existing};
  renderAporteSheet();
  openSheet();
}
// escolher instituição/tipo reconstrói a folha inteira (pra marcar o botão certo como selecionado) —
// por isso, antes de reconstruir, guardamos o que já foi digitado nos outros campos, senão eles somem.
function syncAporteFields(){
  const v=$('#ap-value'); if(v) aporteDraft.value=v.value;
  const n=$('#ap-name'); if(n) aporteDraft.name=n.value;
  const rn=$('#ap-ratenum'); if(rn) aporteDraft.rateNum=rn.value;
  const mt=$('#ap-maturity'); if(mt) aporteDraft.maturity=mt.value;
  const dt=$('#ap-date'); if(dt) aporteDraft.date=dt.value;
  const nt=$('#ap-note'); if(nt) aporteDraft.note=nt.value;
}
function renderAporteSheet(){
  const d=aporteDraft;
  const insts=['BTG','XP','PicPay','Nubank','Inter','Itaú','Outro'];
  const types=['CDB','Tesouro Direto','LCI/LCA','Fundo','ETF','Ação','Caixa','Outro'];
  const klassOf={'CDB':'Renda Fixa','Tesouro Direto':'Renda Fixa','LCI/LCA':'Renda Fixa','Fundo':'Fundos','ETF':'ETFs','Ação':'ETFs','Caixa':'Caixa','Outro':'Outros'};
  $('#sheet').innerHTML=`
    <div class="grab"></div>
    <h2>${d.existing?'Cadastrar investimento':'Investi hoje 💗'}</h2>
    <div class="sub">${d.existing?'Adicione algo que você já tem.':'Preencha e comemore seu aporte.'}</div>

    <div class="field"><label>Quanto você investiu?</label>
      <div class="box"><span>R$</span><input id="ap-value" type="number" inputmode="decimal" placeholder="0,00" value="${d.value}" onchange="aporteDraft.value=this.value"></div></div>

    <div class="field"><label>Onde você investiu?</label>
      <div class="opts">${insts.map(i=>`<button class="opt ${d.inst===i?'on':''}" onclick="syncAporteFields();aporteDraft.inst='${i}';renderAporteSheet()">${i}</button>`).join('')}</div></div>

    <div class="field"><label>Em qual tipo de investimento?</label>
      <div class="opts">${types.map(t=>`<button class="opt ${d.type===t?'on':''}" onclick="syncAporteFields();aporteDraft.type='${t}';aporteDraft.klass='${klassOf[t]}';renderAporteSheet()">${t}</button>`).join('')}</div></div>

    <div class="field"><label>Qual o produto? (opcional)</label>
      <div class="box"><input id="ap-name" type="text" placeholder="Ex: CDB 110% CDI, IVVB11..." value="${esc(d.name)}"></div></div>

    ${isRF(d.type)?`
    <div class="field"><label>Como ele rende?</label>
      <div class="opts">${RATE_KINDS.map(rk=>`<button class="opt ${d.rateKind===rk.k?'on':''}" onclick="syncAporteFields();aporteDraft.rateKind='${rk.k}';renderAporteSheet()">${rk.label}</button>`).join('')}</div>
      <div style="font-size:11px;color:var(--ink-3);margin-top:6px">O app usa isso pra ir atualizando o rendimento sozinho, todo dia, com o CDI oficial do Banco Central.</div></div>

    ${d.rateKind&&d.rateKind!=='none'?`
    <div class="field"><label>Taxa contratada</label>
      <div class="box"><input id="ap-ratenum" type="number" step="0.01" inputmode="decimal" placeholder="${esc((RATE_KINDS.find(x=>x.k===d.rateKind)||{}).hint||'')}" value="${d.rateNum!=null?d.rateNum:''}"><span>${esc((RATE_KINDS.find(x=>x.k===d.rateKind)||{}).unit||'')}</span></div></div>`:''}

    <div class="field"><label>Vencimento (opcional)</label>
      <div class="box"><input id="ap-maturity" type="date" value="${d.maturity||''}"></div></div>
    `:''}

    <div class="field"><label>Data do aporte</label>
      <div class="box"><input id="ap-date" type="date" value="${d.date}"></div></div>

    <div class="field"><label>Observação (opcional)</label>
      <div class="box"><input id="ap-note" type="text" placeholder="Ex: parte do 13º" value="${esc(d.note)}"></div></div>

    <button class="btn" onclick="submitAporte()">${d.existing?'Adicionar à carteira':'Confirmar aporte ✨'}</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Cancelar</button>
  `;
}
function submitAporte(){
  const v=parseFloat(($('#ap-value')?.value||'').replace(',','.'))||0;
  aporteDraft.value=v;
  aporteDraft.name=$('#ap-name')?.value||'';
  if($('#ap-ratenum')) aporteDraft.rateNum=$('#ap-ratenum').value;
  if($('#ap-maturity')) aporteDraft.maturity=$('#ap-maturity').value;
  aporteDraft.date=$('#ap-date')?.value||todayISO();
  aporteDraft.note=$('#ap-note')?.value||'';
  const d=aporteDraft;
  if(!v||v<=0){ shake('#ap-value'); return; }
  if(!d.inst){ toast('Escolha a instituição'); return; }
  if(!d.type){ toast('Escolha o tipo'); return; }

  // if leaving demo, clear demo portfolio first (once)
  if(S.demo){ S.demo=false; S.holdings=[]; S.history=[]; S.contributions=[]; }

  const klass=d.klass||'Outros';
  // merge into existing holding of same inst+name, else new
  let h=S.holdings.find(x=>x.inst===d.inst && x.name.toLowerCase()===(d.name||d.type).toLowerCase());
  if(h){ h.invested+=v; h.baseValue=(h.baseValue!=null?+h.baseValue:+h.current)+v; h.current=h.baseValue; h.since=d.date||todayISO(); }
  else{
    const rk=d.rateKind||null, rn=toNum(d.rateNum);
    h={id:'h'+Date.now(), inst:d.inst, klass, type:d.type, name:d.name||d.type, invested:v, current:v,
       baseValue:v, since:d.date||todayISO(), rateKind:rk, rateNum:rn, rate:rateText(rk,rn),
       maturity:d.maturity||null, liquidity: klass==='Caixa'?'Diária':'—', issuer:d.inst, fgc: klass==='Renda Fixa',
       category:d.type, admFee:null, perfFee:0, health:'g'};
    S.holdings.push(h);
  }
  S.transactions.push({date:d.date, inst:d.inst, type:d.type, name:d.name||d.type, value:v, note:d.note});

  // update history (this month's net worth)
  const tot=total();
  if(!S.history.length) S.history=[tot]; else S.history[S.history.length-1]=tot;

  // contributions & streak (per calendar month of aporte)
  let xp=100; let leveledMsg='';
  const prevLevel=level();
  addXP(100);
  if(!d.existing){
    // streak: count if this is a new month with a contribution
    S.streak=(S.streak||0)+ (isNewContribMonth(d.date)?1:0);
    if(S.streak>0 && S.streak%3===0){ addXP(500); xp+=500; }
  }
  const newLevel=level();
  if(newLevel.min>prevLevel.min) leveledMsg=`Você subiu para ${newLevel.icon} ${newLevel.name}!`;

  save(); renderAll(); closeSheet();

function handleFile(file){
  if(!file) return;
  const status=$('#import-status');
  status.innerHTML='<span class="spinner"></span> Lendo '+esc(file.name)+'...';
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='csv'||ext==='tsv'){
    const r=new FileReader();
    r.onload=e=>{ try{ const rows=parseCSV(e.target.result); reviewImport(rows,file.name); }catch(err){ status.textContent='Não consegui ler esse arquivo. Tente conferir manualmente.'; reviewImport([],file.name); } };
    r.readAsText(file);
  } else if(ext==='xlsx'||ext==='xls'){
    if(!window.XLSX){ status.textContent='Leitor de planilha indisponível — abrindo revisão manual.'; reviewImport([],file.name); return; }
    const r=new FileReader();
    r.onload=e=>{ try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      reviewImport(rowsFromMatrix(arr),file.name);
    }catch(err){ status.textContent='Erro ao ler planilha — abrindo revisão manual.'; reviewImport([],file.name); } };
    r.readAsArrayBuffer(file);
  } else if(ext==='pdf'){
    if(!window.pdfjsLib){ status.textContent='Leitor de PDF indisponível agora — abrindo revisão manual.'; reviewImport([],file.name); return; }
    const r=new FileReader();
    r.onload=async e=>{
      try{
        const rows = await parsePDF(new Uint8Array(e.target.result));
        if(!rows.length){
          status.innerHTML='📄 Li o PDF, mas não reconheci linhas de investimento nele (pode ser um extrato em formato diferente, ou um PDF escaneado/foto, que ainda não sei ler). Adicione manualmente abaixo — ou confira se o PDF tem texto selecionável.';
        } else {
          status.innerHTML=`✅ Lido! Encontrei ${rows.length} ${rows.length>1?'possíveis investimentos':'possível investimento'} — confira e corrija abaixo antes de confirmar.`;
        }
        reviewImport(rows,file.name);
      }catch(err){
        status.textContent='Não consegui ler esse PDF automaticamente. Adicione as linhas manualmente abaixo.';
        reviewImport([],file.name);
      }
    };
    r.readAsArrayBuffer(file);
  } else { status.textContent='Formato não suportado.'; }
}

/* ---------- client-side PDF text extraction + heuristic row parsing ---------- */
async function pdfToLines(bytes){
  const doc = await pdfjsLib.getDocument({data:bytes}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    // group items into lines by y-position (rounded), then sort each line by x
    const rows=new Map();
    content.items.forEach(it=>{
      if(!it.str || !it.str.trim()) return;
      const y = Math.round(it.transform[5]/2)*2; // tolerance bucket
      if(!rows.has(y)) rows.set(y,[]);
      rows.get(y).push({x:it.transform[4], s:it.str});
    });
    const ys=[...rows.keys()].sort((a,b)=>b-a); // top to bottom (pdf y grows upward)
    ys.forEach(y=>{
      const line=rows.get(y).sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim();
      if(line) lines.push(line);
    });
  }
  return lines;
}
const INST_KEYWORDS=['BTG Pactual','BTG','XP Investimentos','XP','PicPay','Nubank','Nu Invest','Itaú','Itau','Bradesco','Santander','Banco do Brasil','Caixa Econômica','Inter','C6 Bank','Safra','Rico','Clear','Modal','Sicredi','Sicoob'];
const TYPE_PATTERNS=[
  {re:/tesouro\s*(selic|ipca|prefixado|direto)?/i, type:'Tesouro Direto', klass:'Renda Fixa'},
  {re:/\bcdb\b/i, type:'CDB', klass:'Renda Fixa'},
  {re:/\blci\b|\blca\b/i, type:'LCI/LCA', klass:'Renda Fixa'},
  {re:/\bcri\b|\bcra\b/i, type:'CRI/CRA', klass:'Renda Fixa'},
  {re:/deb[êe]ntures?/i, type:'Debênture', klass:'Renda Fixa'},
  {re:/\bfic\b|\bfim\b|fundo/i, type:'Fundo', klass:'Fundos'},
  {re:/\betf\b/i, type:'ETF', klass:'ETFs'},
  {re:/a[çc][ãa]o|a[çc][õo]es/i, type:'Ação', klass:'ETFs'},
  {re:/poupan[çc]a/i, type:'Poupança', klass:'Caixa'},
  {re:/\b[A-Z]{4}11\b/, type:'ETF', klass:'ETFs'},      // tickers estilo ETF/FII: BOVA11, IVVB11...
  {re:/\b[A-Z]{4}[3-6]\b/, type:'Ação', klass:'ETFs'},   // tickers estilo ação: PETR4, VALE3...
];
const VALUE_RE=/(?:R\$\s?)?(\d{1,3}(?:\.\d{3})*,\d{2})(?!\d)/g;
function lineValue(line){
  const matches=[...line.matchAll(VALUE_RE)];
  if(!matches.length) return null;
  const last=matches[matches.length-1][1];
  const n=parseFloat(last.replace(/\./g,'').replace(',','.'));
  return isNaN(n)?null:n;
}
function findInstInLine(line){
  let best='';
  for(const k of INST_KEYWORDS){ if(line.toLowerCase().includes(k.toLowerCase()) && k.length>best.length) best=k; }
  return best;
}
async function parsePDF(bytes){
  const lines = await pdfToLines(bytes);
  const out=[];
  let currentInst=''; // rastreia a instituição do cabeçalho de seção mais recente, linha a linha
  lines.forEach(line=>{
    const found=findInstInLine(line);
    if(found) currentInst=found.replace(/ (Investimentos|Pactual|Econômica)$/,'');
    if(line.length<6) return;
    const tp = TYPE_PATTERNS.find(t=>t.re.test(line));
    if(!tp) return;
    const val = lineValue(line);
    if(!val || val<=0) return;
    // product name: strip trailing monetary values and excess whitespace, cap length
    let name = line.replace(VALUE_RE,'').replace(/\s{2,}/g,' ').trim();
    if(name.length>60) name=name.slice(0,60).trim();
    if(!name) name=tp.type;
    out.push({inst:currentInst, type:tp.type, name, value:val, rate:'', maturity:''});
  });
  // de-duplicate identical (name+value) lines that PDF sometimes repeats (headers/footers per page)
  const seen=new Set(); const dedup=[];
  out.forEach(r=>{ const k=r.name+'|'+r.value; if(!seen.has(k)){ seen.add(k); dedup.push(r); } });
  return dedup.slice(0,40); // sanity cap
}
function splitCSVLine(line, sep){
  // separador respeita campos entre aspas (ex.: "15,38% a.a." não deve virar duas colunas)
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){
      if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else { inQ=false; } }
      else cur+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===sep){ out.push(cur); cur=''; }
      else cur+=c;
    }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function parseCSV(txt){
  const sep = txt.indexOf(';')>-1 && txt.indexOf(';')<txt.indexOf('\n') ? ';' : (txt.indexOf('\t')>-1?'\t':',');
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  const matrix=lines.map(l=>splitCSVLine(l,sep));
  return rowsFromMatrix(matrix);
}
function xlsxSerialToBR(n){
  // converte número de série de data do Excel/XLSX (ex.: 48553) pra DD/MM/AAAA
  if(typeof n!=='number'||!isFinite(n)||n<1||n>100000) return null;
  const ms=Math.round((n-25569)*86400*1000);
  const d=new Date(ms);
  if(isNaN(d.getTime())) return null;
  const dd=String(d.getUTCDate()).padStart(2,'0');
  const mm=String(d.getUTCMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getUTCFullYear()}`;
}
function rowsFromMatrix(matrix){
  if(!matrix.length) return [];
  // detect header
  const head=matrix[0].map(x=>String(x).trim().toLowerCase());
  // exact match first (so e.g. "rendimento" doesn't swallow "rendimento_12_meses"), then substring fallback
  const idxOf=(...keys)=>{
    for(const k of keys){ const i=head.indexOf(k); if(i>-1) return i; }
    return head.findIndex(h=>keys.some(k=>h.includes(k)));
  };
  const iInst=idxOf('instituicao','instituição','banco','corretora','emissor');
  const iName=idxOf('ativo','produto','nome','descricao','descrição');
  const iType=idxOf('tipo','classe');
  const iModal=idxOf('modalidade');
  const iIndex=idxOf('indexador');
  const iValA=idxOf('valor_aplicado','valor aplicado','vlr aplicado','aplicado','valor investido');
  const iValP=idxOf('posicao_atual','posição_atual','posicao atual','posição atual','saldo atual','valor atual','posicao','posição','valor de mercado');
  const iRend12=idxOf('rendimento_12_meses','rendimento 12 meses','rendimento_12m');
  let iRend=-1; head.forEach((h,i)=>{ if(iRend===-1 && h.includes('rendimento') && i!==iRend12) iRend=i; });
  const iRate=idxOf('rentabilidade','rentab','taxa');
  const iMat=idxOf('vencim','venc');
  const iValGeneric=idxOf('valor','saldo','montante','total'); // legacy single-column CSVs (ex.: instituicao,tipo,produto,valor,rentabilidade,vencimento)
  const hasHeader = iInst>-1 || iName>-1 || iValA>-1 || iValP>-1 || iValGeneric>-1;
  const body = hasHeader? matrix.slice(1):matrix;
  const parseNum=s=>{
    s=String(s==null?'':s).trim();
    if(!s) return 0;
    s=s.replace(/^R\$\s?/,'').trim();
    // if it has a comma, treat as pt-BR format (1.234,56) -> strip thousand dots, comma->decimal point
    // otherwise assume it's already a plain decimal number (17800.0, 18679.97 — como no CSV de extrato)
    if(s.includes(',')) s=s.replace(/\./g,'').replace(',', '.');
    const n=parseFloat(s);
    return isNaN(n)?0:n;
  };
  return body.map(r=>{
    const inst = iInst>-1? r[iInst]||'' : (r[0]||'');
    const name = iName>-1? r[iName]||'' : (r[1]||'');
    const type = iType>-1? r[iType]||'' : '';
    const modalidade = iModal>-1? r[iModal]||'' : '';
    const indexador = iIndex>-1? r[iIndex]||'' : '';
    const rendA = iRend>-1? parseNum(r[iRend]) : 0;
    const rendB = iRend12>-1? parseNum(r[iRend12]) : 0;
    const rendimento = rendA || rendB;
    let invested = iValA>-1? parseNum(r[iValA]) : 0;
    let current = iValP>-1? parseNum(r[iValP]) : (iValGeneric>-1? parseNum(r[iValGeneric]) : parseNum(r[r.length-1]));
    if(!current && invested) current = invested; // só temos o valor aplicado
    if(!invested && current) invested = rendimento? (current-rendimento) : current; // deriva aplicado quando só vem posição + rendimento
    const rate = iRate>-1? r[iRate]||'' : '';
    const rawMat = iMat>-1? r[iMat] : '';
    const maturity = (typeof rawMat==='number') ? (xlsxSerialToBR(rawMat)||String(rawMat)) : (rawMat||''); // XLSX pode entregar data como número de série
    return {inst, name, type, modalidade, indexador, invested, current, rendimento, rate, maturity};
  }).filter(x=>x.current>0 || x.invested>0 || x.name);
}
let importRows=[];
function blankImportRow(){ return {inst:'',type:'',modalidade:'',indexador:'',name:'',invested:'',current:'',rate:'',maturity:''}; }

  $('#sheet').innerHTML=`
    <div class="grab"></div>

const KLASS_BY_TYPE={'cdb':'Renda Fixa','lci':'Renda Fixa','lca':'Renda Fixa','lci/lca':'Renda Fixa','cri':'Renda Fixa','cra':'Renda Fixa','cri/cra':'Renda Fixa','debênture':'Renda Fixa','debenture':'Renda Fixa','tesouro direto':'Renda Fixa','tesouro':'Renda Fixa','poupança':'Caixa','poupanca':'Caixa','caixa':'Caixa','fundo':'Fundos','fic':'Fundos','fim':'Fundos','etf':'ETFs','ação':'ETFs','acao':'ETFs','ações':'ETFs','acoes':'ETFs','criptoativo':'Outros','cripto':'Outros','criptomoeda':'Outros'};
function confirmImport(){
  const klassGuess=t=>{ t=(t||'').toLowerCase(); if(/cripto/.test(t))return'Outros'; if(/cdb|tesouro|lci|lca|cri|cra|deb|renda fix|selic|ipca/.test(t))return'Renda Fixa'; if(/fundo|fic|fim/.test(t))return'Fundos'; if(/etf|ivvb|bova|small|11/.test(t))return'ETFs'; if(/caixa|reserva|poupan/.test(t))return'Caixa'; return'Renda Fixa';};
  const typeGuess=t=>{ t=(t||'').toLowerCase(); if(/cripto/.test(t))return'Criptoativo'; if(/tesouro|selic|ipca/.test(t))return'Tesouro Direto'; if(/cdb/.test(t))return'CDB'; if(/\blca\b/.test(t))return'LCA'; if(/\blci\b/.test(t))return'LCI'; if(/etf|ivvb|bova|11/.test(t))return'ETF'; if(/fundo|fic|fim/.test(t))return'Fundo'; if(/caixa|reserva|poupan/.test(t))return'Caixa'; return'CDB';};
  const num=v=>parseFloat(String(v==null?'':v).replace(',','.'))||0;
  const valid=importRows.map(r=>({...r, invested:num(r.invested), current:num(r.current)}))
    .filter(r=>r.current>0 || r.invested>0 || r.name || r.inst);
  if(!valid.length){ toast('Adicione ao menos um investimento com valor.'); return; }
  S.demo=false;
  S.holdings = valid.map((r,i)=>{
    const nm=r.name||r.type||'Investimento';
    const typeRaw=(r.type||'').trim();
    const klass = KLASS_BY_TYPE[typeRaw.toLowerCase()] || klassGuess(nm+' '+typeRaw+' '+(r.modalidade||''));
    const type = typeRaw || typeGuess(nm);
    const invested = r.invested || r.current || 0;
    const current = r.current || r.invested || 0;
    const modalidade = r.modalidade && r.modalidade!=='—' ? r.modalidade : '';
    const indexador = r.indexador && r.indexador!=='—' ? r.indexador : '';
    const rate = (r.rate && r.rate!=='—') ? r.rate : (indexador || '—');
    const sp = rateSpec({rate}); // lê "110,25% do CDI", "IPCA + 6%", "13% a.a." e já deixa pronto pra render sozinho
    return {id:'i'+Date.now()+i, inst:r.inst||'—', klass, type, name:nm,
      invested, current, baseValue:current, since:todayISO(),
      rateKind: sp?sp.kind:null, rateNum: sp?sp.num:null,
      rate, maturity:normDate(r.maturity), liquidity: klass==='Caixa'?'Diária':'—',
      issuer:r.inst||'—', fgc: klass==='Renda Fixa', category: modalidade||type||klass,
      admFee:null, perfFee:0, health:'g', modalidade, indexador};
  });
  accrueAll();
  const tot=total();
  S.history=[tot]; // start fresh series from imported total
  addXP(200);
  save(); renderAll(); closeSheet();
  celebrate('Carteira importada! 💎', `${valid.length} investimentos consolidados — ${BRL(tot)}.`, 200);
  go('carteira');
}
function normDate(s){ if(!s)return null; s=String(s).trim();
  let m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/); if(m)return m[3]+'-'+m[2]+'-'+m[1];
  m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m)return s.slice(0,10); return null; }

const TICKER_ORDER=['WRLD11','IVVB11','NASD11','BOVA11','SMAL11','GOLD11'];
const DEFAULT_TARGET={rf:70,WRLD11:10,IVVB11:5,NASD11:3,BOVA11:4,SMAL11:3,GOLD11:5};

// identifica a qual ticker um holding pertence (só ETFs/ações), por substring no nome/tipo/categoria
function tickerOf(h){
  if(!h) return null;
  const isEtfLike = h.klass==='ETFs' || h.type==='ETF' || h.type==='Ação';
  if(!isEtfLike) return null;
  const hay=((h.name||'')+' '+(h.type||'')+' '+(h.category||'')).toUpperCase();
  for(const t of TICKER_ORDER){ if(hay.includes(t)) return t; }
  return null;
}
// valor e % atuais por bucket (rf + cada ticker + Outros), sobre o total da carteira
function currentAllocByTarget(){
  const tot=total();
  const val={rf:0,Outros:0}; TICKER_ORDER.forEach(t=>val[t]=0);
  S.holdings.forEach(h=>{
    const v=+h.current||0; const tk=tickerOf(h);
    if(tk) val[tk]+=v;
    else if(h.klass==='Renda Fixa'||h.klass==='Caixa') val.rf+=v;
    else val.Outros+=v;
  });
  const pct={}; Object.keys(val).forEach(k=>{ pct[k]= tot? val[k]/tot*100 : 0; });
  return {val,pct,tot};
}

  const tot=total(); if(!tot) return [];
  const limit=S.profile.concLimit||15;
  const byIssuer={};
  S.holdings.forEach(h=>{ if(h.klass!=='Renda Fixa') return; const key=h.issuer||h.inst||'—'; byIssuer[key]=(byIssuer[key]||0)+(+h.current||0); });
  return Object.entries(byIssuer).map(([issuer,v])=>({issuer,v,pct:v/tot*100})).filter(x=>x.pct>=limit).sort((a,b)=>b.pct-a.pct);
}
// radar de oportunidades — SEMPRE baseado em variação digitada por você, nunca em preço buscado automaticamente
function radarTier(movePct){
  if(movePct==null||isNaN(movePct)) return null;
  const drop=-movePct; // positivo = queda de preço
  if(drop>=15) return {level:3,emoji:'🟢🟢🟢',label:'Queda forte',msg:'Momento interessante para aumentar o aporte aqui, desde que a tese continue válida.'};
  if(drop>=10) return {level:2,emoji:'🟢🟢',label:'Queda relevante',msg:'Direcione uma parcela maior do seu aporte pra cá.'};
  if(drop>=5) return {level:1,emoji:'🟢',label:'Queda moderada',msg:'Continue aportando normalmente.'};
  return null;
}
function iaRecomendacao(){
  const amt=S.profile.monthlyContribution;
  const target=targetAllocation();
  const {pct:cur}=currentAllocByTarget();
  const moves=S.profile.recentMoves||{};
  const modo=!!S.profile.modoOportunidade;
  const keys=['rf',...TICKER_ORDER];

  // gap-based allocation (prioriza quem está mais abaixo da meta); Modo Oportunidade reforça quem teve queda
  const gaps={}; let gapSum=0;
  keys.forEach(k=>{
    let g=Math.max(0,(target[k]||0)-(cur[k]||0));
    if(modo && k!=='rf'){ const tier=radarTier(moves[k]); if(tier){ const boost=tier.level===3?2:tier.level===2?1.6:1.3; g=g>0? g*boost : tier.level*2.5; } }
    gaps[k]=g; gapSum+=g;
  });
  const alloc={};
  const onTarget = gapSum<=0.5;
  if(!onTarget){ keys.forEach(k=>{ alloc[k]=Math.round((amt*gaps[k]/gapSum)/10)*10; }); }
  else { keys.forEach(k=>{ alloc[k]=Math.round((amt*(target[k]||0)/100)/10)*10; }); } // nunca fica parado: se está tudo no alvo, mantém a proporção
  const allocSum=keys.reduce((a,k)=>a+alloc[k],0);
  const drift=Math.round(amt-allocSum);
  if(drift!==0){ const biggest=keys.reduce((a,k)=>alloc[k]>=alloc[a]?k:a,keys[0]); alloc[biggest]=Math.max(0,alloc[biggest]+drift); }

  const rows=keys.map(k=>{
    const isRf=k==='rf';
    const label=isRf?'Renda fixa':`${TICKER_META[k].emoji} ${k}`;
    const c=cur[k]||0, t=target[k]||0, diff=c-t, a=alloc[k]||0;
    let reason;
    if(diff<=-0.5) reason=`${isRf?'Renda fixa':k} está ${Math.abs(diff).toFixed(0)} pontos percentuais abaixo da sua meta.`;
    else if(diff>=3) reason=`Você está ${diff.toFixed(0)} p.p. acima da meta em ${isRf?'renda fixa':k}. Considere não direcionar novos aportes aqui até que outras classes se aproximem da meta.`;
    else reason='Está próxima da meta — este valor mantém a proporção.';
    if(!isRf && modo){ const tier=radarTier(moves[k]); if(tier) reason+=` ${tier.emoji} ${tier.label}: ${tier.msg}`; }
    return {k,label,c,t,diff,a,reason,overweight:diff>=3};
  }).sort((x,y)=> y.a-x.a || y.diff-x.diff);

  const rowsHtml=rows.map(r=>`
    <div class="card" style="padding:14px 16px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b style="font-size:14px">${r.label}</b>
        <b class="tnum" style="color:${r.a>0?'var(--rose)':'var(--ink-3)'};font-family:var(--fdisplay);font-size:17px">${r.a>0?BRL(r.a):'R$ 0'}</b>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-top:4px">
        <span>Você tem <b style="color:var(--ink)">${r.c.toFixed(0)}%</b></span><span>Meta <b style="color:var(--wine)">${r.t.toFixed(0)}%</b></span>
      </div>
      <div style="font-size:12.5px;color:var(--ink);margin-top:8px;line-height:1.5">${esc(r.reason)}</div>
    </div>`).join('');

  const radarRows=TICKER_ORDER.map(t=>{
    const mv=moves[t]; const tier=mv!=null&&mv!==''?radarTier(+mv):null;
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)">
      <span style="flex:1;font-size:12.5px">${TICKER_META[t].emoji} ${t}</span>
      <div class="box" style="padding:5px 8px;width:78px;display:flex;align-items:center"><input type="number" step="0.1" placeholder="0" value="${mv!=null?mv:''}" onchange="setRecentMove('${t}',this.value)" style="width:100%"><span style="font-size:11px">%</span></div>
      <span style="font-size:10.5px;min-width:64px;text-align:right;color:${tier?'var(--good)':'var(--ink-3)'}">${tier?tier.emoji:'—'}</span>
    </div>`;
  }).join('');
  const radarMsgs=TICKER_ORDER.map(t=>{ const mv=moves[t]; const tier=mv!=null&&mv!==''?radarTier(+mv):null; return tier?`<div style="font-size:12px;margin-top:6px"><b>${TICKER_META[t].emoji} ${t}</b> ${tier.emoji} <b>${tier.label}</b> — ${tier.msg}</div>`:''; }).join('');

  const usOverlap=['WRLD11','IVVB11','NASD11'].filter(t=>(target[t]>0)||(cur[t]>0));
  const overlapCard = usOverlap.length>=2 ? `
  <div class="card">
    <div class="eyebrow">🌍 Por que você tem ${usOverlap.join(' + ')}?</div>
    <div style="font-size:12.5px;color:var(--ink);margin-top:8px;line-height:1.55">Esses ETFs se sobrepõem: todos levam a boa parte das mesmas grandes empresas americanas (Microsoft, Apple, Nvidia, Amazon...). <b>Você está aumentando deliberadamente sua exposição aos EUA</b> — isso não é um erro nem diversificação independente, é uma escolha consciente de concentrar parte da carteira lá. Vale ter isso claro pra decidir se é o que você quer.</div>
  </div>` : '';

  const conc=concentracaoEmissor();
  const concCard = conc.length? `<div class="alertbox a"><div class="ai">🏦</div><div><b>Concentração por emissor</b><p style="color:var(--ink)">${conc.map(c=>`<b>${esc(c.issuer)}</b>: ${c.pct.toFixed(0)}% da sua carteira (${BRL(c.v)})`).join('<br>')}. Considere direcionar novos aportes para outras classes ou emissores — sem necessidade de mexer no que já está aplicado.</p></div></div>` : '';

  const bigOverweight=rows.filter(r=>r.diff>=10);
  const sellNote = bigOverweight.length
    ? `<div class="alertbox a"><div class="ai">⚖️</div><div><b>Sobre reequilibrar por venda</b><p style="color:var(--ink)">${bigOverweight.map(r=>r.label).join(', ')} ${bigOverweight.length>1?'estão':'está'} bem acima da meta. Rebalanceamento por venda pode ser considerado se isso persistir por muitos meses — mas o caminho preferido é sempre corrigir com os próximos aportes, direcionando-os pra quem está abaixo da meta.</p></div></div>`
    : `<div class="alertbox i"><div class="ai">⚖️</div><div><b>Nunca vendemos pra reequilibrar</b><p style="color:var(--ink)">O reequilíbrio da sua carteira acontece pelos novos aportes, nunca por venda automática. Isso evita custos, impostos e decisões apressadas.</p></div></div>`;

  return `
  <div class="card" style="background:linear-gradient(140deg,var(--surface-2),var(--surface))">
    <div class="eyebrow">💌 O que fazer com meus ${BRL(amt)}?</div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
      <span style="font-size:13px">Tenho</span>
      <div class="field" style="margin:0;flex:1"><div class="box" style="padding:8px 12px"><span>R$</span><input type="number" value="${amt}" onchange="setContribution(this.value);switchIA('recomendacao')"></div></div>
      <span style="font-size:13px">pra investir este mês.</span>
    </div>
    <div style="font-size:12px;color:var(--ink-2);margin-top:10px;line-height:1.5">Esse valor é sempre investido este mês — nunca fica parado esperando o "momento ideal". A distribuição abaixo prioriza o que está mais abaixo da sua meta.</div>
    <button class="btn ghost" style="margin-top:12px" onclick="openTargetAlloc()">🎯 Editar minha carteira-alvo</button>
  </div>

  <div class="card">
    <div class="eyebrow">🔎 Radar de oportunidades</div>
    <div style="font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.5">Digite a variação de preço aproximada que você observou em cada ETF (ex.: -8 pra uma queda de 8%). O app <b>nunca busca preços sozinho</b> — os dados vêm de você.</div>
    <div style="margin-top:10px">${radarRows}</div>
    ${radarMsgs?`<div style="margin-top:6px">${radarMsgs}</div>`:''}
    <button class="btn ${modo?'':'sec'}" style="margin-top:12px" onclick="toggleModoOportunidade()">${modo?'✅ Modo Oportunidade ativado':'⚡ Quero aproveitar uma queda'}</button>
    ${modo?`<div style="font-size:11px;color:var(--ink-2);margin-top:8px">Esta é uma regra matemática baseada na sua estratégia, não uma previsão de mercado.</div>`:''}
  </div>

  <div class="section-title" style="margin-top:22px">💗 Sugestão deste aporte</div>
  ${rowsHtml}

  ${overlapCard}
  ${concCard}
  ${sellNote}
  <div class="alertbox a"><div class="ai">⚖️</div><div><b>Importante — leia antes</b><p style="color:var(--ink)">Esta ferramenta é educacional e não constitui recomendação financeira personalizada. As sugestões seguem regras matemáticas simples (a diferença entre sua carteira-alvo e sua carteira atual) — não preveem o mercado e não garantem rentabilidade futura. Confirme preços e taxas atuais na sua corretora. A decisão final é sempre sua.</p></div></div>

  saveTargetAlloc:()=>{ S.profile.targetAllocation=Object.assign({},taDraft); save(); closeSheet(); if(iaTab==='recomendacao') renderIABody(); toast('Carteira-alvo atualizada 🌸'); },
  setRecentMove:(t,v)=>{ S.profile.recentMoves=S.profile.recentMoves||{}; if(v===''||v==null) delete S.profile.recentMoves[t]; else S.profile.recentMoves[t]=+v; save(); renderIABody(); },
  toggleModoOportunidade:()=>{ S.profile.modoOportunidade=!S.profile.modoOportunidade; save(); renderIABody(); },
  openTargetAlloc,syncAporteFields,
  openEditHolding,renderEditSheet,syncEditFields,saveEditHolding,confirmDeleteHolding,deleteHolding,
  undoMyData,dismissImportBanner,fetchTaxas,
  switchCarteira,switchPerf,switchIA,openAporte,submitAporte,handleFile,confirmImport,renderImportSheet,
  openEdu,completeEdu,showReport,openSettings,askAI,autogrow,resetDemo,startFresh,wipeAll});

/* ---------- boot ---------- */
(function boot(){
  try{ const t=localStorage.getItem('florescer.theme'); if(t&&t!=='auto') document.documentElement.setAttribute('data-theme',t); }catch(e){}
  load(); ensureIds(); applyMyData(); accrueAll(); save(); renderAll();
  fetchTaxas(true); // busca as taxas do Banco Central em segundo plano; se falhar, segue com as últimas conhecidas
})();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* segue funcionando normalmente sem o service worker */ });
  });
}
</script>
